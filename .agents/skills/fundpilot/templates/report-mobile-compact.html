<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ========== 简洁紧凑风格 - 类似Markdown渲染 ========== */

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding: 20px 15px;
  margin: 0;
  line-height: 1.6;
  color: #24292e;
  background: #fff;
  font-size: 18px; /* 增大基础字体，适合手机 */
}

.container {
  max-width: 100%;
}

/* ========== 标题样式 - Markdown风格 ========== */

h1 {
  border-bottom: 2px solid #e1e4e8;
  padding-bottom: 10px;
  margin: 0 0 20px 0;
  font-size: 28px;
  font-weight: 600;
  color: #24292e;
}

h2 {
  border-bottom: 1px solid #e1e4e8;
  padding-bottom: 8px;
  margin: 25px 0 15px 0;
  font-size: 22px;
  font-weight: 600;
  color: #24292e;
}

h3 {
  margin: 20px 0 10px 0;
  font-size: 20px;
  font-weight: 600;
  color: #24292e;
}

/* ========== 表格样式 - 简洁 ========== */

table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
  font-size: 17px;
}

th {
  background: #f6f8fa;
  color: #24292e;
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  border: 1px solid #d1d5da;
}

td {
  border: 1px solid #d1d5da;
  padding: 8px 12px;
}

/* ========== 颜色样式 ========== */

.red { color: #cb2431; font-weight: 600; }
.green { color: #28a745; font-weight: 600; }
.blue { color: #0366d6; font-weight: 600; }
.gray { color: #6a737d; }

/* ========== 引用块样式 - Markdown风格 ========== */

blockquote {
  border-left: 4px solid #dfe2e5;
  background: #f6f8fa;
  padding: 12px 15px;
  margin: 15px 0;
  color: #6a737d;
}

blockquote strong {
  color: #24292e;
}

/* ========== 提示框 - 简化版 ========== */

.tip-success { border-left: 4px solid #28a745; background: #f0fff4; padding: 12px 15px; margin: 15px 0; }
.tip-warning { border-left: 4px solid #cb2431; background: #fff8f8; padding: 12px 15px; margin: 15px 0; }
.tip-info { border-left: 4px solid #0366d6; background: #f1f8ff; padding: 12px 15px; margin: 15px 0; }

/* ========== 统计卡片 - 简洁 ========== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 10px;
  margin: 15px 0;
}

.stat-item {
  text-align: center;
  background: #f6f8fa;
  padding: 10px;
  border-radius: 6px;
}

.stat-num {
  font-size: 24px;
  font-weight: 600;
  color: #24292e;
}

.stat-text {
  font-size: 16px;
  color: #6a737d;
}

/* ========== 列表样式 ========== */

ul, ol {
  margin: 10px 0;
  padding-left: 20px;
}

li {
  margin: 6px 0;
  font-size: 18px;
}

/* ========== 段落样式 ========== */

p {
  margin: 10px 0;
  font-size: 18px;
}

/* ========== 链接样式 ========== */

a {
  color: #0366d6;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.source-link {
  color: #6a737d;
  font-size: 16px;
}

/* ========== 代码/标签样式 ========== */

.tag {
  display: inline-block;
  background: #f6f8fa;
  border: 1px solid #d1d5da;
  border-radius: 3px;
  padding: 2px 8px;
  font-size: 16px;
  color: #24292e;
}

/* ========== 页脚 ========== */

.footer {
  border-top: 2px solid #e1e4e8;
  padding-top: 15px;
  margin-top: 25px;
  color: #6a737d;
  font-size: 16px;
}

/* ========== 来源链接区域 ========== */

.sources-section {
  background: #f6f8fa;
  border: 1px solid #d1d5da;
  border-radius: 6px;
  padding: 15px;
  margin: 20px 0;
}

.sources-section h4 {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #24292e;
}

.source-item {
  margin: 8px 0;
  font-size: 16px;
}

</style>
</head>
<body>

<div class="container">

<h1>{{REPORT_TITLE}}</h1>
<p class="gray">{{REPORT_META}}</p>

{{STAT_OVERVIEW}}

{{CONTENT}}

{{SOURCES_SECTION}}

<div class="signature">
<strong>声明：</strong> {{DECLARATION}}
</div>

<div class="footer">
<p>{{FOOTER_LINE}}</p>
<p>{{FOOTER_DISCLAIMER}}</p>
</div>

</div>

</body>
</html>
