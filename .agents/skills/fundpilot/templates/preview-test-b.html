<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>链接测试 · 页面 B</title>
  <style>
    :root { --bg: #1a1025; --card: #261833; --text: #f3e8ff; --muted: #b49cc9; --accent: #e879f9; --link: #c4b5fd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 20px 48px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px 22px; border: 1px solid rgba(255,255,255,.08); }
    .pill { display: inline-block; background: rgba(232,121,249,.15); color: var(--accent); padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; }
    a { color: var(--link); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="pill">页面 B</span>
    <h1>这是第二页</h1>
    <p class="sub">若从 A 点相对链接能正常到这里，说明同目录多页跳转在你的预览方式下可用。</p>
    <div class="card">
      <p style="margin-bottom:14px">返回测试入口：</p>
      <a href="preview-test-a.html">← 回到页面 A</a>
    </div>
  </div>
</body>
</html>
